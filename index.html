<noscript><div class="no-js"><h1>The red square</h1><p>Open this HTML in a browser with JavaScript enabled to use the visual steps.</p><p>The answer is <strong>4 square units</strong>. The full side is 2 units. This lesson explains the geometry using five equal square widths across a total distance of 10.</p></div></noscript>
<script>'use strict';
const rdC={paper:'#fffdfa',ink:'#172c3e',red:'#ed3560',blue:'#2266b0',teal:'#008071',amber:'#a16b00',muted:'#a2adb5',purple:'#7553a8'};
function rdPt(x,y){return [x,y]}
function rdLine(a,b,c=rdC.ink,w=4,dash='',extra=''){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''} ${extra}/>`}

function rdPoly(points,fill,stroke='none',opacity=.16,extra=''){return `<polygon points="${points.map(p=>p.join(',')).join(' ')}" fill="${fill}" fill-opacity="${opacity}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round" ${extra}/>`}

function rdDim(a,b,t,c=rdC.ink,shift=0,size=30){let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;let A=[a[0]+nx*shift,a[1]+ny*shift],B=[b[0]+nx*shift,b[1]+ny*shift],tick=7;return rdLine(A,B,c,2)+rdLine([A[0]+nx*tick,A[1]+ny*tick],[A[0]-nx*tick,A[1]-ny*tick],c,2)+rdLine([B[0]+nx*tick,B[1]+ny*tick],[B[0]-nx*tick,B[1]-ny*tick],c,2)+rdText((A[0]+B[0])/2+nx*23,(A[1]+B[1])/2+ny*23,t,c,size)}
function rdTick(a,b,c=rdC.ink){let x=(a[0]+b[0])/2,y=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);return rdLine([x-dy/l*8,y+dx/l*8],[x+dy/l*8,y-dx/l*8],c,3)}
function rdSector(p,a,b,r,c,op=.3){if(b<a)b+=Math.PI*2;let q=[p[0]+r*Math.cos(a),p[1]+r*Math.sin(a)],z=[p[0]+r*Math.cos(b),p[1]+r*Math.sin(b)];return `<path d="M${p[0]} ${p[1]} L${q[0]} ${q[1]} A${r} ${r} 0 ${b-a>Math.PI?1:0} 1 ${z[0]} ${z[1]} Z" fill="${c}" fill-opacity="${op}" stroke="${c}" stroke-width="2"/>`}
function rdSectorBetween(p,a,b,r,c){let aa=Math.atan2(a[1]-p[1],a[0]-p[0]),bb=Math.atan2(b[1]-p[1],b[0]-p[0]);let d=((bb-aa+Math.PI*3)%(Math.PI*2))-Math.PI;if(d<0){let t=aa;aa=bb;bb=t;}return rdSector(p,aa,bb,r,c)}
function rdRight(p,a,b,size=23,c=rdC.ink){let ax=a[0]-p[0],ay=a[1]-p[1],al=Math.hypot(ax,ay),bx=b[0]-p[0],by=b[1]-p[1],bl=Math.hypot(bx,by);ax=ax/al*size;ay=ay/al*size;bx=bx/bl*size;by=by/bl*size;return `<path d="M${p[0]+ax} ${p[1]+ay} L${p[0]+ax+bx} ${p[1]+ay+by} L${p[0]+bx} ${p[1]+by}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`}
function rdSvg(content,title){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="${title}" style="display:block;width:100%;height:auto;overflow:visible"><title>${title}</title><rect width="960" height="600" rx="20" fill="${rdC.paper}"/>${content}</svg>`}
function rdFull({right=true,fade=false,square=true,mid=false,radii=false}={}){const F=(x,y)=>[270+42*x,500-42*y];let out=rdLine([40,500],[920,500],rdC.ink,4)+rdCircle(F(0,5),210,fade?rdC.muted:rdC.ink)+ (right?rdCircle(F(10,5),210,fade?rdC.muted:rdC.ink):'');if(mid)out+=rdLine(F(5,0),F(5,10.2),rdC.purple,2,'7 8');if(square)out+=rdPoly([F(4,0),F(4,2),F(6,2),F(6,0)],rdC.red,rdC.red,.22);if(radii){out+=rdLine(F(0,5),F(5,5),rdC.red,5)+rdLine(F(10,5),F(15,5),rdC.red,5)+rdDot(F(0,5))+rdDot(F(10,5))+rdText(375,260,'5',rdC.ink,38)+rdText(795,260,'5',rdC.ink,38)}return {out,F}}
function rdCircleView({square=true,diameter=false,diagonal=false,radius=false,bottom=false,dots=true}={}){const F=(x,y)=>[310+44*x,510-44*y],B=F(0,0),T=F(0,10),O=F(0,5),P=F(4,2),Q=F(4,0),M=F(5,0);let out=rdLine([75,510],[790,510],rdC.ink,4)+rdCircle(O,220,rdC.muted);if(square)out+=rdPoly([Q,P,F(6,2),F(6,0)],rdC.red,rdC.red,.13);if(diameter)out+=rdLine(B,T,rdC.ink,4);if(diagonal)out+=rdLine(T,M,rdC.blue,4);if(radius)out+=rdLine(O,P,rdC.amber,4);if(bottom)out+=rdLine(B,P,rdC.teal,5);if(dots){out+=rdDot(B);if(square)out+=rdDot(P)+rdDot(M);if(diameter||diagonal)out+=rdDot(T);if(radius)out+=rdDot(O)}return {out,F,B,T,O,P,Q,M}}
function rdDetail({square=true,diagonal=true,bottom=false,fill=false,newDiagonal=false}={}){const B=[110,450],Q=[470,450],P=[470,270],M=[560,450],R=[650,450];let out=rdLine([65,450],[835,450],rdC.ink,4);out+=`<path d="M110 450 A450 450 0 0 0 560 0" fill="none" stroke="${rdC.muted}" stroke-width="3" opacity=".75"/>`;if(square)out+=rdPoly([Q,P,[650,270],R],rdC.red,rdC.red,.08);if(fill){out+=rdPoly([B,Q,P],rdC.teal,rdC.teal,.11)+rdPoly([P,Q,M],rdC.blue,rdC.blue,.17)}if(diagonal)out+=rdLine(P,M,rdC.blue,5,'',newDiagonal?'data-draw="true"':'');if(bottom)out+=rdLine(B,P,rdC.teal,5);out+=rdLine(Q,P,rdC.red,5)+rdDot(B)+rdDot(Q)+rdDot(P)+rdDot(M);return {out,B,Q,P,M,R}}
function rdAngleScene(which){let v=rdCircleView({diameter:true,diagonal:true,radius:true,bottom:true});let {B,T,O,P}=v,out=rdPoly([T,O,P],rdC.blue,'none',.08)+(which==='bottom'||which==='sum'?rdPoly([B,O,P],rdC.teal,'none',.09):'')+v.out;out+=rdTick(T,O,rdC.amber)+rdTick(B,O,rdC.amber)+rdTick(P,O,rdC.amber);if(['top','bottom','sum'].includes(which)){out+=rdSectorBetween(T,O,P,52,rdC.blue)+rdSectorBetween(P,T,O,53,rdC.blue)}if(['bottom','sum'].includes(which)){out+=rdSectorBetween(B,O,P,43,rdC.teal)+rdSectorBetween(P,O,B,43,rdC.teal)}if(which==='top'){out+=rdText(245,170,'5',rdC.amber,30)+rdText(418,319,'5',rdC.amber,30)+rdText(730,205,'These two radii',rdC.ink,28)+rdText(730,244,'are equal.',rdC.ink,28)+rdText(730,316,'The blue angles',rdC.blue,28)+rdText(730,355,'match.',rdC.blue,28)}if(which==='bottom'){out+=rdText(255,400,'5',rdC.amber,30)+rdText(418,319,'5',rdC.amber,30)+rdText(730,205,'These two radii',rdC.ink,28)+rdText(730,244,'are equal.',rdC.ink,28)+rdText(730,316,'The green angles',rdC.teal,28)+rdText(730,355,'match.',rdC.teal,28)}if(which==='sum'){out+=rdText(730,190,'At the corner:',rdC.ink,28)+rdText(730,233,'blue + green',rdC.purple,29)+rdText(730,315,'At the two ends:',rdC.ink,28)+rdText(730,358,'blue + green',rdC.purple,29);out+=rdText(480,565,'Two equal angle totals make 180°.',rdC.ink,29)}return out}

function rdAngleFan(showHalves){let v=rdCircleView({diameter:true,diagonal:true,radius:true,bottom:true}),{B,T,O,P}=v;let out=v.out+rdTick(T,O,rdC.amber)+rdTick(B,O,rdC.amber)+rdTick(P,O,rdC.amber)+rdSectorBetween(T,O,P,52,rdC.blue)+rdSectorBetween(P,T,O,53,rdC.blue)+rdSectorBetween(B,O,P,43,rdC.teal)+rdSectorBetween(P,O,B,43,rdC.teal);let c=[755,370],a=Math.atan(.5),b=Math.PI/2-a,start=Math.PI;for(let [angle,col]of[[a,rdC.blue],[b,rdC.teal],[b,rdC.teal],[a,rdC.blue]]){out+=rdSector(c,start,start+angle,130,col,.25);start+=angle;}out+=rdLine([625,370],[885,370],rdC.ink,3)+rdLine(c,[755,240],rdC.ink,3)+rdDot(c,rdC.ink,4);if(showHalves){out+=rdText(705,318,'90°',rdC.ink,31)+rdText(808,318,'90°',rdC.ink,31)+rdText(755,175,'Two matching halves.',rdC.ink,29)+rdText(755,449,'90° + 90° = 180°',rdC.ink,28);}else{out+=rdText(755,175,'180° altogether',rdC.ink,31)+rdText(688,416,'two ends',rdC.ink,26)+rdText(819,416,'corner',rdC.ink,26)+rdText(755,475,'Copies of the angles',rdC.ink,26)+rdText(755,514,'make a straight line.',rdC.ink,26);}return out;}

function rdGhost(transform){return `<g id="rotation-ghost" transform="${transform}" opacity=".90">${rdPoly([[470,270],[470,450],[560,450]],rdC.blue,rdC.blue,.25)}${rdRight([470,450],[470,270],[560,450],16,rdC.blue)}</g>`}
function rdReflect(partition=false){const B=[170,430],M=[480,430],R=[790,430],P=[418,306],Q=[418,430],U=[542,306],V=[542,430];let out=`<path d="M170 430 A310 310 0 0 0 480 120 A310 310 0 0 0 790 430" fill="none" stroke="${rdC.muted}" stroke-width="3"/>`+rdLine([90,430],[870,430],rdC.ink,4)+rdLine([480,135],M,rdC.purple,2,'7 8')+rdPoly([B,Q,P],rdC.teal,rdC.teal,.13)+rdPoly([U,V,R],rdC.teal,rdC.teal,.13)+rdPoly([Q,P,U,V],rdC.red,rdC.red,.20)+rdLine(B,P,rdC.teal,4)+rdLine(U,R,rdC.teal,4)+rdDot(B)+rdDot(R)+rdDot(M);if(partition){for(let i=0;i<5;i++){let x=170+124*i,c=i===2?rdC.red:rdC.teal;out+=rdLine([x,475],[x+124,475],c,5)+rdLine([x,465],[x,485],c,3)+rdText(x+62,507,'s',c,33)}out+=rdLine([790,465],[790,485],rdC.teal,3)+rdDim([170,540],[790,540],'10',rdC.ink,0,34)}else{out+=rdDim([170,468],[418,468],'2s',rdC.teal,0,31)+rdDim([418,468],[542,468],'s',rdC.red,0,31)+rdDim([542,468],[790,468],'2s',rdC.teal,0,31)+rdText(480,560,'5 + 5 = 10',rdC.ink,33)}return out}
function redDiagram(key){let o='',v,F;switch(key){
case 'cover':v=rdFull({radii:true});o=v.out+rdText(480,458,'?',rdC.red,42)+rdText(480,555,'Find the red square’s area.',rdC.ink,31);break;
case 'area_goal':o=rdPoly([[335,145],[625,145],[625,435],[335,435]],rdC.red,rdC.red,.25)+rdDim([335,110],[625,110],'s',rdC.red,-5,38)+rdDim([665,145],[665,435],'s',rdC.red,-5,38)+rdText(480,510,'Area = side × side',rdC.ink,34)+rdText(480,560,'First find one full side.',rdC.ink,28);break;

const lessonSteps=[{"id": 0, "key": "cover", "chapter": "The question", "title": "How much space does the red square cover?", "body": "Each circle has radius <b>5</b>. The red square sits on the floor, with its two top corners touching the circles. We need its <b>area</b>. We will first find the length of one complete side.", "equation": "", "takeaway": "First find the side; then find the area.", "next": "Start with the square →"}, {"id": 1, "key": "area_goal", "chapter": "Understand the picture", "title": "What length are we looking for?", "body": "Call the square’s <b>complete side</b> <i>s</i>. Its width is <i>s</i>, and its height is also <i>s</i>, because all four sides of a square are equal. Once we know <i>s</i>, multiplying width by height will give the area.", "equation": "area = <i>s</i> × <i>s</i>", "takeaway": "Throughout this lesson, s means one complete side.", "next": "Look at the circle →"}, {"id": 2, "key": "diameter", "chapter": "Understand the picture", "title": "How tall is one circle?", "body": "The distance from the centre to the top is one radius: <b>5</b>. The distance from the centre to the bottom is another radius: <b>5</b>. Those two lengths make the circle’s full height, called its <b>diameter</b>.", "equation": "5 + 5 = 10", "takeaway": "The circle’s top is 10 above the floor.", "next": "Find the floor span →"}, {"id": 3, "key": "floor_span", "chapter": "Understand the picture", "title": "How far apart are the two floor contacts?", "body": "Between the centres are two radii, each <b>5</b>. Each centre sits directly above its circle’s floor contact. Moving both endpoints straight down preserves their horizontal separation. So the floor distance between those contacts is also <b>10</b>.", "equation": "floor span = 5 + 5 = 10", "takeaway": "Keep this floor distance of 10: we will split it later.", "next": "Find the middle →"}, {"id": 4, "key": "middle", "chapter": "Understand the picture", "title": "Why is the square in the middle?", "body": "The equal circles are mirror images across the middle line. At the height of the square’s top, their inward boundaries match. The square touches both boundaries, so half its width lies on each side. The floor span of <b>10</b> also splits into <b>5 and 5</b>.", "equation": "10 ÷ 2 = 5", "takeaway": "The left floor contact is 5 from the square’s middle.", "next": "Split the square →"}, {"id": 5, "key": "half_square", "chapter": "Understand the picture", "title": "What are the dimensions of half the square?", "body": "Cut the square vertically down its middle. The left half is still <i>s</i> high, but only <b>half a side</b> wide. Its height is therefore twice its width. Notice that <i>s</i> still labels a complete side.", "equation": "half-width = <i>s</i> ÷ 2", "takeaway": "Half the square is twice as tall as it is wide.", "next": "Draw one diagonal →"}, {"id": 6, "key": "small_diagonal", "chapter": "Understand the picture", "title": "How steep is this line?", "body": "Join the square’s bottom-middle to its top-left corner. Travelling along that diagonal means moving left by half a side and up by a full side. So the upward movement is <b>twice</b> the sideways movement.", "equation": "rise = 2 × sideways distance", "takeaway": "For every 1 unit left, this straight line rises 2 units.", "next": "Keep the line going →"}, {"id": 7, "key": "extend", "chapter": "Understand the picture", "title": "What happens if we extend that straight line?", "body": "Keep going in exactly the same direction. From the line’s starting point on the floor to the vertical diameter, the <b>total</b> sideways distance is <b>5</b>. The total rise must be twice that: <b>10</b>.", "equation": "total rise = 2 × 5 = 10", "takeaway": "These totals are measured from where the line began on the floor.", "next": "Where does it arrive? →", "animation": "extend-line"}, {"id": 8, "key": "extend", "chapter": "Understand the picture", "title": "Why does it reach the very top of the circle?", "body": "At the vertical diameter, our extended line is <b>10 above the floor</b>. The circle’s top is also <b>10 above the floor</b>. These are the same position. So the circle’s top, the square’s corner and the square’s bottom-middle lie on one straight line.", "equation": "", "takeaway": "The straight line reaches the circle’s top because both heights are 10.", "next": "Add the second line →"}, {"id": 9, "key": "join_bottom", "chapter": "Find the right angle", "title": "What triangle have we made inside the circle?", "body": "Join the circle’s bottom to the square’s top-left corner. Together with the diameter and the line we extended, this makes a triangle with all three corners on the circle. We will now find the angle at the square’s corner.", "equation": "", "takeaway": "Concentrate on the triangle joining the circle’s top, corner and bottom.", "next": "Look at two equal radii →"}, {"id": 10, "key": "angle_top", "chapter": "Find the right angle", "title": "Why do these two blue angles match?", "body": "Draw the radius from the centre to the square’s corner. In the blue triangle, that radius and the upward radius both measure <b>5</b>. A triangle with two equal sides folds into matching halves. The two corners opposite those equal sides therefore have equal angles.", "equation": "blue angle = blue angle", "takeaway": "Equal sides give the blue triangle two equal base angles.", "next": "Look at the lower half →"}, {"id": 11, "key": "angle_bottom", "chapter": "Find the right angle", "title": "Why do the two green angles match too?", "body": "The green triangle also has two sides of length <b>5</b>: the radius to the corner and the downward radius. Its two base angles match for the same reason. At the square’s corner, one blue angle and one green angle sit directly beside each other.", "equation": "green angle = green angle", "takeaway": "The whole angle at the square’s corner is blue plus green.", "next": "Add the triangle’s angles →"}, {"id": 12, "key": "angle_total", "chapter": "Find the right angle", "title": "What do a triangle’s three angles add to?", "body": "The three angles of a triangle make a straight angle: <b>180°</b>. On the right, we place copies of this triangle’s corners side by side: blue from the top, green from the bottom, then blue plus green from the square’s corner.", "equation": "all three corners together = 180°", "takeaway": "We are adding the angles of the large triangle inside the circle.", "next": "Find two equal groups →", "animation": "angle-copy"}, {"id": 13, "key": "angle_sum", "chapter": "Find the right angle", "title": "Why must blue plus green equal 90°?", "body": "There are <b>two identical groups</b> of blue plus green in that total of <b>180°</b>. Each group is therefore half of 180°. The angle at the square’s corner is one of those groups, so it measures <b>90°</b>.", "equation": "180° ÷ 2 = 90°", "takeaway": "The two lines to the circle’s top and bottom meet at a right angle.", "next": "Look below the corner →"}, {"id": 14, "key": "right_angle", "chapter": "Find the right angle", "title": "What about the angle on the other side?", "body": "The line from the circle’s top continues straight through the square’s corner towards the floor. The angles beside it add to <b>180°</b>. One is <b>90°</b>, so the other is too. The two downward sloping lines are <b>perpendicular</b>: they meet at a right angle.", "equation": "180° − 90° = 90°", "takeaway": "The two sloping lines down to the floor meet at a right angle.", "next": "See the two triangles →"}, {"id": 15, "key": "triangles", "chapter": "Compare the triangles", "title": "Which two triangles will we compare?", "body": "Keep the two triangles beside the square’s left edge. Each has a horizontal bottom and a vertical side, so each has a right angle. Their sloping edges also meet at a right angle. We will copy the smaller triangle and leave the original visible.", "equation": "", "takeaway": "The smaller triangle is half a side wide and one full side high.", "next": "Turn a copy →"}, {"id": 16, "key": "turn", "chapter": "Compare the triangles", "title": "Why does the turned copy have the same shape?", "body": "Turn the copy through <b>90°</b>. Its sloping edge becomes <b>parallel</b> to the left triangle’s sloping edge: they run in the same direction, because both are 90° from the original slope. Both triangles also have horizontal and vertical edges. So their angles match, although the copy is smaller.", "equation": "quarter-turn = 90°", "takeaway": "Turning changes the direction; enlarging will change the size.", "next": "Compare their heights →", "animation": "turn-triangle"}, {"id": 17, "key": "match_height", "chapter": "Compare the triangles", "title": "How much taller must the turned copy become?", "body": "The turned copy and the left triangle start at the <b>same bottom corner</b>. The copy is <b>half a side</b> high; the left triangle is <b>a full side</b> high. Doubling the copy makes its height reach the <b>same top corner</b>.", "equation": "(<i>s</i> ÷ 2) × 2 = <i>s</i>", "takeaway": "A complete side is twice half a side.", "next": "Double the whole triangle →"}, {"id": 18, "key": "double", "chapter": "Compare the triangles", "title": "What happens to its width when we double it?", "body": "Double <b>every length</b>. The copy’s top now reaches the square’s corner. Its sloping edge has the same direction as the left triangle’s sloping edge and passes through that same corner, so both reach the same floor point. The copy’s width therefore matches the gap: <i>s</i> doubled is <b>2<i>s</i></b>.", "equation": "<i>s</i> × 2 = 2<i>s</i>", "takeaway": "Doubling the height also doubles the width.", "next": "Read the left floor gap →", "animation": "scale-triangle"}, {"id": 19, "key": "left_width", "chapter": "Find the side", "title": "What have we learned about the left gap?", "body": "The bottom of that left triangle is the floor gap from the circle’s contact to the square’s left edge. We have just shown that its length is <b>2<i>s</i></b>. That means <b>two complete square sides</b>, placed end to end.", "equation": "left gap = 2<i>s</i>", "takeaway": "The left gap is twice the width of the red square.", "next": "Look at the right gap →"}, {"id": 20, "key": "reflect", "chapter": "Find the side", "title": "How long is the right gap?", "body": "Reflect the picture across its middle line. The equal circles exchange places, and the centred square matches itself. The right floor gap must therefore equal the left floor gap. It also measures <b>2<i>s</i></b>: two complete square sides.", "equation": "right gap = 2<i>s</i>", "takeaway": "The floor has a 2s gap on each side of the square.", "next": "Join the three pieces →", "animation": "reflect-gap"}, {"id": 21, "key": "floor_pieces", "chapter": "Find the side", "title": "Which three pieces make the floor span of 10?", "body": "Start at the left circle’s floor contact and travel to the right circle’s floor contact. You cross the left gap, <b>2<i>s</i></b>, then the square’s width, <b><i>s</i></b>, then the right gap, <b>2<i>s</i></b>. Together, these make our known distance of <b>10</b>.", "equation": "10 = 2<i>s</i> + <i>s</i> + 2<i>s</i>", "takeaway": "The equation simply adds the three touching pieces of the floor.", "next": "Count complete sides →"}, {"id": 22, "key": "five_sides", "chapter": "Find the side", "title": "How many equal lengths of s fit into 10?", "body": "The left gap contains two copies of <i>s</i>. The square contributes one copy. The right gap contains two more. That is <b>five equal copies</b> of the square’s complete side, all adding up to <b>10</b>.", "equation": "10 = 5<i>s</i>", "takeaway": "Five equal side lengths fill the whole distance of 10.", "next": "Find one side →"}, {"id": 23, "key": "side_two", "chapter": "Find the area", "title": "What is the length of one complete side?", "body": "Split the total distance of <b>10</b> equally among those <b>five</b> pieces. Each piece is <b>2</b> long. Each piece represents <i>s</i>, so the red square is <b>2 wide</b> and <b>2 high</b>.", "equation": "<i>s</i> = 10 ÷ 5 = 2", "takeaway": "We have found the square’s complete side: 2.", "next": "Turn the side into area →"}, {"id": 24, "key": "area_four", "chapter": "Find the area", "title": "How many unit squares cover the red square?", "body": "The square has two rows, each containing two unit squares. Count them: <b>four unit squares</b>. This is what multiplying width by height means. The side length is <b>2</b>, and the area is <b>4 square units</b>.", "equation": "area = 2 × 2 = 4 square units", "takeaway": "Length measures an edge; area counts the unit squares inside.", "next": "See the finished answer →", "animation": "split-unit-squares"}, {"id": 25, "key": "answer", "chapter": "The answer", "title": "The small red square has area 4", "body": "The complete floor span is <b>10</b>. It contains five equal square-side lengths, so each side is <b>2</b>. A square with width <b>2</b> and height <b>2</b> has area <b>4 square units</b>.", "equation": "area = 4 square units", "takeaway": "The question names no measurement unit, so the answer is in square units.", "next": "Start again"}];

let lessonIndex=0;
let readingAll=false;
let textLarge=false;
let activeFrame=null;
let animationToken=0;
const htmlEscape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
const status=document.getElementById('status');
const reducedMotion=()=>window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
function clearMotion(){animationToken++;if(activeFrame!==null){cancelAnimationFrame(activeFrame);activeFrame=null;}}
function motionSpec(key){return typeof redMotion==='function'?redMotion(key):null;}
function svgTransform(pivot,angle,scale){return `translate(${pivot[0]} ${pivot[1]}) rotate(${angle}) scale(${scale}) translate(${-pivot[0]} ${-pivot[1]})`;}
function playMovement(force=false){
 clearMotion();
 const step=lessonSteps[lessonIndex],spec=motionSpec(step.key),figure=app.querySelector('.diagram');
 if(!figure||readingAll)return;
 const motionLabel=document.getElementById('motion-status');
 if(reducedMotion()&&!force){if(motionLabel)motionLabel.textContent='Movement paused in your device settings.';return;}
 const token=animationToken;
 const afterMotion=[...figure.querySelectorAll('[data-after-motion]')];
 function finishMotion(){for(const el of afterMotion)el.style.opacity='1';}
 if(spec){
  const el=figure.querySelector('#'+(spec.id||'rotation-ghost'));
  if(!el)return;
  const from=spec.from||{angle:0,scale:1},to=spec.to||{angle:-90,scale:1},pivot=spec.pivot||[470,450];
  const duration=spec.duration||2400;
  let start=null;
  for(const label of afterMotion)label.style.opacity='0';
  if(motionLabel)motionLabel.textContent='Watch the coloured copy move.';
  el.setAttribute('transform',svgTransform(pivot,from.angle,from.scale));
  function frame(time){
   if(token!==animationToken)return;
   if(start===null)start=time;
   const p=Math.min(1,(time-start)/duration),ease=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
   el.setAttribute('transform',svgTransform(pivot,from.angle+(to.angle-from.angle)*ease,from.scale+(to.scale-from.scale)*ease));
   if(p<1)activeFrame=requestAnimationFrame(frame);else{activeFrame=null;finishMotion();if(motionLabel)motionLabel.textContent='The original stays in place.';}
  }
  activeFrame=requestAnimationFrame(frame);
 }else{
  const lines=[...figure.querySelectorAll('[data-draw]')];
  if(!lines.length)return;
  if(motionLabel)motionLabel.textContent='Follow the new line.';
  for(const line of lines){
   if(typeof line.getTotalLength!=='function')continue;
   const n=line.getTotalLength();
   line.animate?.([{strokeDasharray:`${n} ${n}`,strokeDashoffset:n},{strokeDasharray:`${n} ${n}`,strokeDashoffset:0}],{duration:1800,easing:'ease-in-out'});
  }
 }
}
function bottomNavigation(index){
 const cover=index===0,last=index===lessonSteps.length-1;
 const label=(lessonSteps[index].next||'Next step').replace(/\s*→\s*$/,'');
 return `<div class="nav-bottom no-print">${cover?'':`<button data-action="back">← Back</button>`}<button class="primary" data-action="${last?'restart':'next'}">${htmlEscape(last?'Start again':label)}${last?'':' →'}</button></div>`;
}
function footNavigation(){return `<div class="foot no-print"><label for="step-select">Go to a step<select id="step-select">${lessonSteps.map((s,i)=>`<option value="${i}" ${i===lessonIndex?'selected':''}>${i===0?'Start':i+'.'} ${htmlEscape(s.title)}</option>`).join('')}</select></label><div class="foottools"><button class="quiet" data-action="read-all">Read all steps</button><button class="quiet" data-action="print">Print lesson</button></div></div><p class="file-note no-print">Use Next when you are ready. The lesson does not move on by itself.</p>`;}
function stepContents(s,index,all=false){
 const titleTag=all?'h2':'h1';
 const equation=s.equation||'';
 const hasMotion=Boolean(motionSpec(s.key))||['small_diagonal','extend','join_bottom'].includes(s.key);
 return `<div class="reading"><${titleTag} ${all?'':'id="step-heading" tabindex="-1"'}>${htmlEscape(s.title)}</${titleTag}><div class="body-copy">${s.body}</div></div><figure class="diagram" aria-label="${htmlEscape(s.title)}">${redDiagram(s.key)}</figure>${all?'':`<div class="diagram-actions no-print">${hasMotion?`<button data-action="replay">↻ Replay movement</button><span class="motion-status" id="motion-status"></span>`:''}<button class="quiet" data-action="enlarge" aria-label="Enlarge the diagram">Enlarge diagram</button></div>`}<div class="reading"><div class="equation">${equation}</div>${s.takeaway?`<div class="takeaway">${s.takeaway}</div>`:''}</div>`;
}
function renderLesson(focus=false){
 clearMotion();readingAll=false;
 const s=lessonSteps[lessonIndex],n=lessonSteps.length-1;
 app.innerHTML=`<article class="lesson ${lessonIndex===0?'cover':''}"><div class="step-top"><p class="step-number">${lessonIndex===0?'A visual solution':`Step ${lessonIndex} of ${n}`}</p>${lessonIndex===0?'':`<div class="small-nav no-print"><button data-action="back" aria-label="Previous step">← Back</button><button data-action="next" aria-label="Next step" ${lessonIndex===n?'disabled':''}>Next →</button></div>`}</div>${stepContents(s,lessonIndex)}${bottomNavigation(lessonIndex)}${lessonIndex===0?'':'<p class="hint no-print">You can also use the left and right arrow keys.</p>'}</article>${footNavigation()}`;
 status.textContent=lessonIndex===0?'Start of the lesson':`Step ${lessonIndex} of ${n}: ${s.title}`;
 if(focus){window.scrollTo({top:0,behavior:'instant'});document.getElementById('step-heading')?.focus({preventScroll:true});}
 if(!reducedMotion())requestAnimationFrame(()=>playMovement());
}
function showStep(index){lessonIndex=Math.max(0,Math.min(lessonSteps.length-1,Number(index)||0));renderLesson(true);}
function renderAll(){
 clearMotion();readingAll=true;
 app.innerHTML=`<article class="lesson"><div class="all-top"><h1>The red square: every step</h1><button data-action="return">Return to my step</button><p>Read from top to bottom. The moving diagrams are shown in their completed positions.</p></div>${lessonSteps.slice(1).map((s,i)=>`<section class="read-step"><p class="step-number">Step ${i+1}</p>${stepContents(s,i+1,true)}<button data-action="jump" data-index="${i+1}" class="no-print">Open this step</button></section>`).join('')}</article>`;
 status.textContent='All steps shown in reading order.';window.scrollTo({top:0,behavior:'instant'});
}
function openDialog(kind){
 const modal=document.getElementById('lesson-dialog');
 const isOriginal=kind==='original';
 modal.innerHTML=`<div class="dialog-head"><h2>${isOriginal?'The original question':'A closer look'}</h2><button data-action="close-dialog">Close ×</button></div>${isOriginal?`<img src="${sourceImage}" alt="Original question: two equal circles of radius 5 above a small red square on a horizontal line. Find the square’s area.">`:`<div class="diagram-scroll" id="diagram-scroll">${redDiagram(lessonSteps[lessonIndex].key)}</div><div class="zoom-controls"><button data-action="zoom-diagram" aria-pressed="false">Zoom in</button></div>`}<p class="dialog-note">${isOriginal?'The two circles each have radius 5. The small square touches both circles and sits on the same floor.':'Use Zoom in for larger labels; scroll across the picture if needed. Close it to continue the explanation.'}</p>`;
 modal.showModal();
}
document.addEventListener('click',event=>{
 const button=event.target.closest?.('[data-action]');if(!button)return;
 const action=button.dataset.action;
 if(action==='next')showStep(lessonIndex+1);
 else if(action==='back')showStep(lessonIndex-1);
 else if(action==='restart')showStep(0);
 else if(action==='replay')playMovement(true);
 else if(action==='original'||action==='enlarge')openDialog(action);
 else if(action==='close-dialog')document.getElementById('lesson-dialog').close();
 else if(action==='zoom-diagram'){const area=document.getElementById('diagram-scroll');const zoomed=area.classList.toggle('zoomed');button.setAttribute('aria-pressed',String(zoomed));button.textContent=zoomed?'Fit the whole diagram':'Zoom in';}
 else if(action==='read-all')renderAll();
 else if(action==='return')renderLesson(true);
 else if(action==='jump')showStep(button.dataset.index);
 else if(action==='large-text'){textLarge=!textLarge;document.documentElement.style.setProperty('--size',textLarge?'1.15':'1');button.setAttribute('aria-pressed',String(textLarge));button.textContent=textLarge?'Normal text':'Larger text';}
 else if(action==='print'){renderAll();requestAnimationFrame(()=>window.print());}
});
document.addEventListener('change',event=>{if(event.target.id==='step-select')showStep(event.target.value);});
document.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||readingAll||document.getElementById('lesson-dialog').open)return;
 if(/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable)return;
 if(event.key==='ArrowRight'){event.preventDefault();showStep(lessonIndex+1);}
 if(event.key==='ArrowLeft'){event.preventDefault();showStep(lessonIndex-1);}
 if(event.key==='Home'){event.preventDefault();showStep(0);}
});
window.redSquareLesson={steps:lessonSteps,showStep,renderAll,renderLesson,playMovement,get index(){return lessonIndex;},get all(){return readingAll;}};
renderLesson();
